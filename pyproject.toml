[project]
name = "moki"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.8,<3.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0,<2.0",
]

[tool.vercel.scripts]
build = "python build.py"
